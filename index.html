<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Calendrier de l'Avent</title>
<meta name="theme-color" content="#2a0a10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Avent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&family=Great+Vibes&family=Nunito:wght@600;700;800&family=Playfair+Display:ital,wght@0,700;1,700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<svg id="guirlande" class="guirlande" aria-hidden="true"></svg>

<header class="tete">
  <img class="logo" src="icons/logo.svg" alt="" width="56" height="63">
  <div>
    <h1>Calendrier de l'Avent</h1>
    <p class="pour" id="pour"></p>
  </div>
</header>

<section id="bandeau" class="bandeau" aria-live="polite" hidden></section>
<section id="carte-notif" class="carte-notif" hidden></section>

<main class="tableau">
  <div class="cadre">
    <span class="clou" aria-hidden="true"></span>
    <svg class="ficelle" viewBox="0 0 200 30" preserveAspectRatio="none" aria-hidden="true"><path d="M24 30L100 3L176 30" fill="none" stroke="#b89a6a" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg>
    <svg class="noeud" viewBox="0 0 100 56" aria-hidden="true">
      <defs>
        <linearGradient id="nSatin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d84650"/><stop offset=".45" stop-color="#a51d28"/><stop offset="1" stop-color="#6a0c14"/></linearGradient>
        <linearGradient id="nPan" x1="0" x2="1"><stop offset="0" stop-color="#8e1620"/><stop offset=".5" stop-color="#c0303a"/><stop offset="1" stop-color="#7a1018"/></linearGradient>
      </defs>
      <path d="M45 28L30 54L38 50L43 56L50 31Z" fill="url(#nPan)"/>
      <path d="M55 28L70 54L62 50L57 56L50 31Z" fill="url(#nPan)"/>
      <path d="M50 24C36 4 10 2 10 18C10 32 34 32 50 26Z" fill="url(#nSatin)"/>
      <path d="M50 24C64 4 90 2 90 18C90 32 66 32 50 26Z" fill="url(#nSatin)"/>
      <path d="M16 15C20 9 32 9 44 20" stroke="#ff9aa0" stroke-width="2.4" fill="none" stroke-linecap="round" opacity=".55"/>
      <path d="M84 15C80 9 68 9 56 20" stroke="#ff9aa0" stroke-width="2" fill="none" stroke-linecap="round" opacity=".35"/>
      <path d="M24 18C30 22 40 24 48 24M76 18C70 22 60 24 52 24" stroke="#5a0810" stroke-width="1.4" fill="none" opacity=".6"/>
      <rect x="42" y="16" width="16" height="15" rx="5" fill="url(#nSatin)"/>
      <path d="M45 19C48 18 52 18 55 19" stroke="#ff9aa0" stroke-width="1.6" fill="none" opacity=".6"/>
    </svg>
    <div id="grille" class="grille"></div>
  </div>
</main>

<div class="scene" aria-hidden="true">
  <div class="scene-inner">
    <div id="lueur" class="lueur"></div>
    <img class="decor" src="img/decor.svg" alt="" draggable="false">
    <canvas id="vivant" class="vivant"></canvas>
    <img class="avant" src="img/avant.svg" alt="" draggable="false">
    <span class="prenom" id="prenom"></span>
  </div>
</div>

<!-- parchemin -->
<div id="parchemin" class="modal" hidden>
  <div class="backdrop"></div>
  <div class="rouleau" role="dialog" aria-modal="true" aria-labelledby="p-titre">
    <div class="roll haut"></div>
    <div class="papier">
      <div class="papier-in">
        <p class="p-jour" id="p-jour"></p>
        <h2 class="p-titre" id="p-titre"></h2>
        <figure class="p-fig" id="p-fig"></figure>
        <p class="p-texte" id="p-texte"></p>
        <p class="p-sign" id="p-sign"></p>
      </div>
    </div>
    <div class="roll bas"></div>
    <svg class="sceau" viewBox="0 0 64 64" aria-hidden="true">
      <defs>
        <radialGradient id="gCire" cx=".38" cy=".32" r=".75"><stop offset="0" stop-color="#e3505a"/><stop offset=".55" stop-color="#a3141f"/><stop offset="1" stop-color="#5e0710"/></radialGradient>
        <radialGradient id="gCireCreux" cx=".6" cy=".65" r=".7"><stop offset="0" stop-color="#b81c28"/><stop offset="1" stop-color="#760b14"/></radialGradient>
      </defs>
      <path d="M32 3C38 2 41 6 46 6C52 7 56 11 57 17C59 21 62 25 61 31C61 37 58 40 58 45C56 51 51 55 45 57C41 59 37 62 31 61C25 61 22 58 17 57C11 55 7 50 6 44C4 40 2 36 3 30C3 24 6 21 7 16C9 10 14 7 20 5C24 4 27 3 32 3Z" fill="url(#gCire)"/>
      <circle cx="32" cy="32" r="19" fill="url(#gCireCreux)"/>
      <circle cx="32" cy="32" r="19" fill="none" stroke="#5a0610" stroke-width="1.5" opacity=".6"/>
      <circle cx="32.6" cy="32.6" r="19" fill="none" stroke="#ff8a92" stroke-width="1" opacity=".35"/>
      <path d="M32 44C23 38 19 34 19 29C19 25.5 21.8 23 25 23C28 23 30.3 24.6 32 27C33.7 24.6 36 23 39 23C42.2 23 45 25.5 45 29C45 34 41 38 32 44Z" fill="#7a0a14"/>
      <path d="M32 43C23.6 37.3 20 33.6 20 29.2C20 26.2 22.3 24 25 24" fill="none" stroke="#ff8a92" stroke-width="1.2" opacity=".5"/>
      <ellipse cx="20" cy="15" rx="7" ry="3.5" transform="rotate(-30 20 15)" fill="#fff" opacity=".35"/>
    </svg>
  </div>
  <button class="fermer" type="button" hidden>Fermer</button>
</div>

<div id="toast" class="toast" role="status"></div>

<div id="notif" class="notif" role="status">
  <img src="icons/icon-192.png" alt="" width="38" height="38">
  <p class="n-app"><b id="n-app"></b><span>maintenant</span></p>
  <p class="n-txt" id="n-txt"></p>
</div>

<div id="test" class="test" hidden>
  <div id="test-panel" class="test-panel" hidden>
    <p class="test-h">Mode test</p>
    <p class="test-heure" id="test-heure"></p>
    <p class="test-note">Simule une date pour voir le chrono et l'ouverture des cases.</p>
    <div class="test-grid" id="test-grid"></div>
    <div class="test-actions">
      <button type="button" data-act="reset">Refermer les cases</button>
      <button type="button" data-act="notif">Tester la notif</button>
      <button type="button" data-act="carte">Carte notifications</button>
    </div>
  </div>
  <button id="test-pill" class="test-pill" type="button" aria-expanded="false" aria-controls="test-panel">
    <svg viewBox="0 0 24 24"><use href="#i-fiole"/></svg> Mode test
  </button>
</div>

<canvas id="fx" class="fx" aria-hidden="true"></canvas>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="pqFace" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c8303a"/><stop offset="1" stop-color="#7c1018"/></linearGradient>
    <linearGradient id="pqDessus" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e2545c"/><stop offset="1" stop-color="#b3262f"/></linearGradient>
    <linearGradient id="pqCote" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6e0c14"/><stop offset="1" stop-color="#4a060c"/></linearGradient>
    <linearGradient id="pqRuban" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f8e2a0"/><stop offset=".5" stop-color="#d4a74a"/><stop offset="1" stop-color="#9c7426"/></linearGradient>
  </defs>
  <symbol id="i-paquet" viewBox="0 0 48 48">
    <ellipse cx="25" cy="43" rx="17" ry="3" fill="#000" opacity=".45"/>
    <path d="M8 20L14 15H42L36 20Z" fill="url(#pqDessus)"/>
    <path d="M36 20L42 15V36L36 42Z" fill="url(#pqCote)"/>
    <rect x="8" y="20" width="28" height="22" fill="url(#pqFace)"/>
    <rect x="19" y="20" width="6" height="22" fill="url(#pqRuban)"/>
    <path d="M19 20L25 15H31L25 20Z" fill="#f6dc94"/>
    <path d="M36 28L42 23V27L36 32Z" fill="#b08a35"/>
    <rect x="8" y="28" width="28" height="5" fill="url(#pqRuban)"/>
    <path d="M25 16C17 6 10 9 14 14C16 17 21 17 25 16Z" fill="#e6bd5e" stroke="#9c7426" stroke-width=".8"/>
    <path d="M25 16C30 5 39 7 36 13C34 16 29 17 25 16Z" fill="#d4a74a" stroke="#9c7426" stroke-width=".8"/>
    <circle cx="25" cy="16" r="2.6" fill="#f8e2a0"/>
  </symbol>
  <symbol id="i-partager" viewBox="0 0 24 24"><path d="M12 3v12M8 7l4-4 4 4M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-cloche" viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15ZM10 20a2 2 0 0 0 4 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
  <symbol id="i-fiole" viewBox="0 0 24 24"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.8 3h10.4a2 2 0 0 0 1.8-3l-5-9V3M7.5 15h9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>

<script src="js/config.js"></script>
<script src="js/dessins.js"></script>
<script src="js/decor-data.js"></script>
<script src="js/app.js"></script>
<script src="js/scene.js"></script>
</body>
</html>
